<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador Universal | TikTok, IG, FB</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 50px 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #007bff; }
        button { padding: 12px 25px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 95%; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        #mensaje { margin-top: 15px; color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Descarga Sin Marca de Agua</h2>
        <p>Pega el enlace de TikTok, Instagram, YouTube o Facebook</p>
        <input type="text" id="videoLink" placeholder="Ej: https://www.tiktok.com/@usuario/video/123...">
        <button onclick="prepararDescarga()">Obtener Video</button>
        <p id="mensaje"></p>
    </div>

    <script>
        function prepararDescarga() {
            let link = document.getElementById('videoLink').value;
            if(link === "") {
                document.getElementById('mensaje').innerText = "Por favor, pega un enlace válido.";
                return;
            }
            // Aquí conectaremos el servidor de Python (Render) más adelante
            document.getElementById('mensaje').style.color = "#28a745";
            document.getElementById('mensaje').innerText = "Procesando enlace... (Próximamente conectaremos el motor)";
        }
    </script>
</body>
</html>
