<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="a73985205a2d78fb4b457603c1f50c78">
    <title>Descarga Sin Marca de Agua</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        p {
            font-size: 0.95rem;
            color: #666666;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e5ee;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
        }
        input[type="text"]:focus {
            border-color: #0056b3;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #00418a;
        }
        button:disabled {
            background-color: #a0c4ff;
            cursor: not-allowed;
        }
        #message {
            margin-top: 20px;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .error {
            color: #d9534f;
            font-weight: bold;
        }
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Descarga Sin Marca de Agua</h1>
        <p>Pega el enlace de TikTok, Instagram, YouTube o Facebook</p>
        
        <input type="text" id="videoUrl" placeholder="https://..." />
        <button id="submitBtn" onclick="processVideo()">Obtener Video</button>

        <div id="message"></div>
    </div>

    <script>
        const API_BACKEND = "https://descargador-videos-app.onrender.com/extract";

        async function processVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            if (!urlInput) {
                messageDiv.innerHTML = '<span class="error">Por favor ingresa una URL válida.</span>';
                return;
            }

            messageDiv.innerHTML = 'Procesando el enlace, por favor espera...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(API_BACKEND, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    messageDiv.innerHTML = `
                        <p style="color: #28a745; font-weight: bold;">${data.title}</p>
                        <a href="${data.download_url}" target="_blank" class="download-btn" download>Descargar Video</a>
                    `;
                } else {
                    messageDiv.innerHTML = `<span class="error">${data.error || 'Error al procesar el enlace.'}</span>`;
                }
            } catch (err) {
                messageDiv.innerHTML = '<span class="error">Error de conexión con el servidor. Inténtalo de nuevo.</span>';
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>

    <!-- Publicidad Monetag (In-Page Push) -->
    <script>(function(s){s.dataset.zone='11873149',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

</body>
</html>
