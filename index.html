<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador Universal | TikTok, IG, FB</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 50px 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #007bff; }
        button { padding: 12px 25px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 95%; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        #resultado { margin-top: 15px; font-weight: bold; }
        .download-btn { display: inline-block; margin-top: 15px; padding: 12px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Descarga Sin Marca de Agua</h2>
        <p>Pega el enlace de TikTok, Instagram, YouTube o Facebook</p>
        <input type="text" id="videoLink" placeholder="Ej: https://www.tiktok.com/@usuario/video/123...">
        <button onclick="obtenerVideo()">Obtener Video</button>
        <div id="resultado"></div>
    </div>

    <script>
        // Dirección de tu servidor backend alojado en Render
        const RENDER_URL = "https://descargador-videos-app.onrender.com/extract";

        async function obtenerVideo() {
            let link = document.getElementById('videoLink').value;
            let resultadoDiv = document.getElementById('resultado');

            if(link === "") {
                resultadoDiv.innerHTML = "<p style='color:red;'>Por favor, pega un enlace válido.</p>";
                return;
            }

            resultadoDiv.innerHTML = "<p style='color:#007bff;'>Procesando video... Esto puede tomar unos segundos.</p>";

            try {
                let response = await fetch(RENDER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: link })
                });

                let data = await response.json();

                if (data.success) {
                    resultadoDiv.innerHTML = `
                        <p style='color:green;'>¡Video listo!</p>
                        <p><strong>${data.title}</strong></p>
                        <a href="${data.download_url}" target="_blank" download class="download-btn">DESCARGAR VIDEO</a>
                    `;
                } else {
                    resultadoDiv.innerHTML = `<p style='color:red;'>Error: ${data.error}</p>`;
                }
            } catch (error) {
                resultadoDiv.innerHTML = "<p style='color:red;'>Error de conexión con el servidor.</p>";
            }
        }
    </script>
</body>
</html>
